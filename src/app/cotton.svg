<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Cotton stock for Coral's paper objects: a faint cloud, a fine grain and a few short fibres. -->
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.9 -0.38"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.18  0 0 0 6 -3.2"/>
  </filter>
  <rect width="360" height="360" filter="url(#cloud)" opacity="0.05"/>
  <rect width="360" height="360" filter="url(#grain)" opacity="0.06"/>
  <g fill="none" stroke="currentColor" stroke-opacity="0.07" stroke-width="0.6" stroke-linecap="round">
    <path d="M24 40c6 1 11 3 15 6"/><path d="M118 22c4 3 9 4 14 4"/><path d="M212 64c5-2 10-2 15 0"/>
    <path d="M300 30c3 4 4 8 4 12"/><path d="M60 140c5 2 9 5 12 9"/><path d="M164 168c6 0 11 2 15 5"/>
    <path d="M268 132c4 3 7 7 8 11"/><path d="M30 250c6-1 12 0 17 3"/><path d="M128 286c3 4 7 6 12 7"/>
    <path d="M236 240c5 1 9 4 12 8"/><path d="M322 300c4 2 8 2 12 1"/><path d="M190 336c5-2 10-2 14 0"/>
  </g>
</svg>
