<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Felt for Coral's desk: the same weave as the cotton, coarser and a little denser. -->
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.2  0 0 0 0.9 -0.36"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.19  0 0 0 6 -3"/>
  </filter>
  <rect width="360" height="360" filter="url(#cloud)" opacity="0.07"/>
  <rect width="360" height="360" filter="url(#grain)" opacity="0.08"/>
</svg>
